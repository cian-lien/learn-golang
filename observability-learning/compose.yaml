name: observability-learning

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317" # Go 应用通过 OTLP/gRPC 推送数据。
      - "127.0.0.1:18889:8889" # 可用 curl 观察 Prometheus 格式。

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      - collector

  grafana:
    image: grafana/grafana:13.1.6
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: learning-admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
